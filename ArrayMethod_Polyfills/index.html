          .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;         /* Light grey background */
      border-top: 5px solid yellowgreen;     /* Blue top border */
      border-radius: 50%;
      animation: spin 2s linear infinite;
      margin: 100px auto; /* Center the spinner */

      100% { transform: rotate(360deg); }
    }
