    <script>
      function hasclass(classes,target){
        const all = classes.trim().split(" ");    // handles extra spaces
    const required = target.trim().split(" ");
    return required.every(cl => all.includes(cl));
      }
      function GetByClass(classname){
        let res=[];
         function traverse(node){
          if(node.nodeType==1&&  typeof node.className === "string" &&hasclass(node.className,classname)){
               res.push(node);
          }
          for(let child of node.children){
            traverse(child);
          }
         }
         traverse(document.body);
         return res;
      }
      const resclass = GetByClass("highlight box");
      console.log("res-->",resclass.map((x)=>x.textContent))

      function GetById(id){
        const traverse=(node)=>{
          if(node.id===id)return node;
          for(let child of node.children){
            let res = traverse(child);
            if(res)return res;
          }
          return null;
        }
        return traverse(document.body)
      }

      function GetTag(tag){
        let res=[];
        let test = tag.toLowerCase();
        function traverse(node){
          if(node.tagName&&node.tagName.toLowerCase()===test)res.push(node);
          for(let child of node.children){
            traverse(child);
          }
          return res;
        }
        traverse(document.body);
        return res;

      }

      function getName(name){
        let res=[];
         function traverse(node){
          let nametest = node.getAttribute("name");
          if(nametest===name){res.push(node)}
          for(let child of node.children){
            traverse(child);
          }
         }
         traverse(document.body);
         return res;
      }
