<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .modal{
            background-color: lightgrey;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 50%;
    border: 1px solid gray;
    border-radius: 5px;
    display: none;
        }
        .modal-header{
    padding: 5px;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
}
.modal-body{
    background-color: whitesmoke;
    height: 100%;
    height: 150px;
    padding: 5px;
}
.button{
    cursor: pointer;
}
    </style>
</head>
<body>
   <h1>Hello</h1>
  <button onClick=handleopen() class="button">Click here</button>
  <div id="modal" class="modal">
     <div id="header" class="modal-header">
       <div id="left">

       </div>
       <div id="right">
         <button id="button" onClick=handleclose() class="button">close</button>
       </div>
     </div>
     <div id="body">
        This modal will display information here
     </div>
  </div>
  <script>
    const handleopen=()=>{
        document.querySelector(".modal").style.display="block"
    }
    const handleclose=()=>{
        document.querySelector(".modal").style.display="none"
    }
  </script>
</body>
</html>
