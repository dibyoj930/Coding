.modal{
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    width: 50%;
    border: 1px solid green;
    border-radius: 8px;
    display: none;
}
.modal-header{
    display: flex;
    justify-content: space-between;
    padding: 5px;
}
.modal-body{
    padding: 10px;
    height: 150px;
}
    </style>
</head>
<body>
   <h1>Hello</h1>
  <button onClick=handleopen() class="button">Click here</button>
  <div class="modal">
<div class="modal-header">
  <p>This is the header</p>
  <button onclick=handleclose()>X</button>
</div>
<div class="modal-body">
<div>Body content</div>
</div>
  </div>

  <script>
    const handleopen=()=>{
        document.querySelector(".modal").style.display="block"
    }
    const handleclose=()=>{
        document.querySelector(".modal").style.display="none"
    }
  </script>
</body>
