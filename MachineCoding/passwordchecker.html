<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .weak{
            color: red;
        }
        .medium{
            color: yellow;
        }
        .strong{
            color: green;
        }
    </style>
</head>
<body>
    <div style="display: flex;align-items: center;justify-content: center;">
         <input type="password" id="password" />
         <button id="button">Show/Hide</button>
         <div id="strength" class="strength"></div>
    </div>
    <script>
        const input = document.getElementById("password");
        const button = document.getElementById("button");
        const strength = document.getElementById("strength");

        button.addEventListener("click",()=>{
            const inputType = input.type;
            input.type = inputType==="password"?"text":"password";
            button.textContent= inputType==="password"?"hide":"show"
        })

        input.addEventListener("input",()=>{
            const value = input.value;
            const strengthDisplay = checkStrength(value);
            strength.textContent = strengthDisplay.label;
            strength.className = "strength "+strengthDisplay.class;
        })

        function checkStrength(inputvalue){
            let score=0;
            if(inputvalue.length>=6)score++;
            if(/[A-Z]/.test(inputvalue))score++;
            if(/[0-9]/.test(inputvalue))score++;
            if(/[^A-Za-z0-9]/.test(inputvalue))score++;

            if(score<=1)return {label:"weak",class:"weak"};
            if(score==2||score===3)return {label:"medium",class:"medium"};
            return {label:"strong",class:"strong"}

        }
        
        

    </script>
</body>
</html>
