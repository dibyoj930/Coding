<body>
    <form id="form">
        <label for="rows">Enter Row</label>
        <input type="number" id="row" min="1"/>
        <label for="rows">Enter Col</label>
        <input type="number" id="col" min="1"/>
        <button type="submit" id="generate">Generate</button>
    </form>
    <div class="style" id="table"></div>
    <script>

       const row = document.getElementById("row");
       const col = document.getElementById("col");
       const table = document.getElementById("table");
       const form = document.getElementById("form");
      

       let rows,cols;
       row.addEventListener("input",(e)=>{
        rows=e.target.value;
       })
       col.addEventListener("input",(e)=>{
        cols=e.target.value;
       })

       const tab = document.createElement("table");
        tab.style.border="1px solid black"
       
       function CreateTable(row,col){
           tab.innerHTML=''
          const thead = document.createElement("thead");
          const tr = document.createElement("tr");
          for(let i=0;i<col;i++){
            const th =  document.createElement("th");
            th.textContent = `Header-${i+1}`;
            tr.appendChild(th);
          }
          thead.appendChild(tr);
          const tbody =  document.createElement("tbody");
          for(let i=0;i<row;i++){
            const tr=document.createElement("tr");
            tr.style.border="1px solid black";
            for(let j=0;j<col;j++){
                const td = document.createElement("td");
                td.textContent=`row-${i+1},col-${j+1}`;
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          tab.appendChild(thead);
          tab.appendChild(tbody);
          table.appendChild(tab);
       }

       
       form.addEventListener("submit",(e)=>{
            e.preventDefault();
            console.log(rows,cols)
            if(rows<=0||cols<=0){
                alert("enter positive values");
            }else{
                CreateTable(rows,cols)
            }
       })
