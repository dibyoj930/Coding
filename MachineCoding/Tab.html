    body{
      margin: 40px;
      background-color: #f4f4f9;
      color: #333;
    }
    
    .container{
       display: flex;
       gap: 1rem;
       justify-content: center;
    }
    .tab{
      padding: 10px;
      text-align: center;
      background-color: white;
      border: 1px solid yellowgreen;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }
    .tab:hover{
      background-color: bisque;
      border-color: aqua;
    }
    .tab.active{
      background-color: #007bff;
      color: white;
      border-color: #007bff;
      font-weight: bold;
    }
    #contentcontainer{
      padding: 10px;
      text-align: center;
      font-size: 1.5rem;
      border: 1px solid forestgreen;
      border-radius: 8px;
      margin-top: 1.5rem;
      max-width: 300px;
    }

  </style>
</head>
<body>

  <div id="tabcontainer" class="container"></div>
  <div id="contentcontainer"></div>

  <script>

    const tabcontainer = document.getElementById("tabcontainer");
    const contentcontainer = document.getElementById("contentcontainer");
    const tabarr = Array.from({length:5},(_,index)=>index);
    const descrarr = tabarr.map((index)=>`content of tab - ${index+1}`);
    contentcontainer.textContent=descrarr[0];

    tabarr.forEach((tab,index)=>{
      const tabdiv = document.createElement("div");
      index==0?tabdiv.classList.add("tab","active"):tabdiv.classList.add("tab");
      tabdiv.textContent=`Tab-${index+1}`;
      tabdiv.addEventListener("click",()=>{
        document.querySelectorAll(".tab").forEach((x)=>x.classList.remove("active"));
        tabdiv.classList.add("active");
        let active=index;
        contentcontainer.textContent=descrarr[active];
      })
      tabcontainer.appendChild(tabdiv);
    })
