<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .imagestyle{
            object-fit: cover;
            width: 100%;
            height: 200px;
            border: 1px solid yellow;
            border-radius: 16px;
        }
        #main-div{
            width: 70%;
            padding: 10px;
            border: 1px solid yellow;
            border-radius: 8px;
            background-color: aquamarine;
            margin: 2.5rem;
        }
        #buttons{
            display: flex;
            justify-content:center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="main-div">
     <div id="imageholder">

     </div>
     <div id="buttons">
     <button id="prev"></button>
     <button id="next"></button>
    </div>
    </div>
    <script>
        const images = [
  {
    src: "https://images.unsplash.com/photo-1516117172878-fd2c41f4a759",
    alt: "A beautiful sunrise over the mountains",
    title: "Sunrise in the Mountains",
  },
  {
    src: "https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0",
    alt: "A calm beach with clear blue water",
    title: "Relaxing Beach",
  },
  {
    src: "https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0",
    alt: "A dense forest with towering trees",
    title: "Mystic Forest",
  },
  {
    src: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750",
    alt: "A cityscape at night with bright lights",
    title: "City Lights at Night",
  },
  {
    src: "https://images.unsplash.com/photo-1441931423375-cc2d99eebb62",
    alt: "A serene lake surrounded by mountains",
    title: "Peaceful Lake",
  },
];
   let activeindex=0;
   const image =  document.createElement("img");
   const main = document.getElementById("imageholder");
   main.appendChild(image);
   const updateimage = ()=>{
    image.src=images[activeindex].src;
    image.alt=images[activeindex].alt;
    image.title=images[activeindex].title;
   }
  
   updateimage();
   const prev = document.getElementById("prev");
   const next = document.getElementById("next");
   image.classList.add("imagestyle");
   prev.textContent="Prev";
   next.textContent="Next"
   prev.style.cursor="pointer";
   next.style.cursor="pointer"
   prev.addEventListener("click",()=>{
    if(activeindex===0){
        activeindex=images.length-1;
        updateimage();
    }else{
        activeindex--;
        updateimage();
    }
   })
   next.addEventListener("click",()=>{
    if(activeindex===images.length-1){
        activeindex=0;
        updateimage();
    }else{
        activeindex++;
        updateimage();
    }
   })

    </script>

</body>
</html>
