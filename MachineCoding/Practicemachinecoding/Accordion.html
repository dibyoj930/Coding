<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accordion</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .accordion {
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .item {
      border-bottom: 1px solid #ddd;
    }
    .item:last-child {
      border-bottom: none;
    }
    .title {
      background: #f9f9f9;
      padding: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .content {
      padding: 10px;
      display: none;
      background: #fff;
    }
    .content.active {
      display: block;
    }
    label {
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <label>
    <input type="checkbox" id="multiple" />
    Allow multiple open
  </label>

  <div class="accordion" id="accordion">
    <div class="item">
      <div class="title">
        <span>Item 1</span>
        <span class="icon">-</span>
      </div>
      <div class="content active">This is content for item 1</div>
    </div>
    <div class="item">
      <div class="title">
        <span>Item 2</span>
        <span class="icon">+</span>
      </div>
      <div class="content">This is content for item 2</div>
    </div>
    <div class="item">
      <div class="title">
        <span>Item 3</span>
        <span class="icon">+</span>
      </div>
      <div class="content">This is content for item 3</div>
    </div>
  </div>

  <script>
    const accordion = document.getElementById("accordion");
    const multipleCheck = document.getElementById("multiple");

    accordion.addEventListener("click", function (e) {
      const title = e.target.closest(".title");
      if (!title) return;

      const item = title.parentElement;
      const content = item.querySelector(".content");
      const icon = title.querySelector(".icon");
      const isOpen = content.classList.contains("active");

      if (multipleCheck.checked) {
        // Multiple allowed
        content.classList.toggle("active");
        icon.textContent = content.classList.contains("active") ? "-" : "+";
      } else {
        // Only one open
        document.querySelectorAll(".accordion .item").forEach((el) => {
          const c = el.querySelector(".content");
          const i = el.querySelector(".icon");
          if (el === item && !isOpen) {
            c.classList.add("active");
            i.textContent = "-";
          } else {
            c.classList.remove("active");
            i.textContent = "+";
          }
        });
      }
    });
  </script>

</body>
</html>
