<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="main">
      <input type="text" id="ipt"/>
      <div id="filter"></div>
    </div>
    <script>
         const locations = [
  "Sydney",
  "Tokyo",
  "New York",
  "London",
  "Paris",
  "Toronto",
  "Rio de Janeiro",
  "Cape Town",
  "Berlin",
  "Buenos Aires",
  "Melbourne",
  "Los Angeles",
  "Barcelona",
  "Vancouver",
  "Rome",
  "Zurich",
  "Stockholm",
  "Vienna",
  "Auckland",
  "Madrid",
  "Hong Kong",
  "Montreal",
  "Lisbon",
  "Prague",
  "Athens",
  "Copenhagen",
  "Oslo",
  "Helsinki",
  "Chicago",
  "Brussels",
  "Dublin",
  "Edinburgh",
  "Amsterdam",
  "Florence",
  "Venice",
  "San Francisco",
  "Seoul",
  "Munich",
  "Perth",
  "Reykjavik",
  "Mumbai",
  "Delhi",
  "Bangalore",
  "Chennai",
  "Hyderabad",
  "Kolkata",
  "Pune",
  "Jaipur",
  "Ahmedabad",
  "Goa"
];

   const input=document.getElementById("ipt");
   const filter = document.getElementById("filter");
   const createlist=(arr)=>{
    filter.innerHTML=''
    const ul=document.createElement("ul");
    arr.forEach((x)=>{
        const li=document.createElement("li");
        li.textContent=x;
        ul.appendChild(li);
    })
    filter.appendChild(ul);
   }

   input.addEventListener("keyup",(e)=>{
    const val  = e.target.value;
    const filtered = locations.filter((x)=>x.toLowerCase().includes(val));
    createlist(filtered);
   })

   window.addEventListener("load",()=>createlist(locations))

    </script>
</body>
</html>
