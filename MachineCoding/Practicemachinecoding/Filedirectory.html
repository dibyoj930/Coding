<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Styled Tree View</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      padding: 2rem;
    }

    #tree {
      max-width: 600px;
      background-color: #fff;
      border: 1px solid #ddd;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.05);
    }

    ul {
      list-style-type: none;
      padding-left: 1rem;
      margin: 0;
    }

    li {
      margin: 0.5rem 0;
      line-height: 1.6;
    }

    .folder::before {
      content: "📁 ";
      font-size: 1.1rem;
    }

    .file::before {
      content: "📄 ";
      font-size: 1.1rem;
    }

    .folder {
      font-weight: 600;
      color: #d2691e;
      cursor: pointer;
    }

    .file {
      color: #2e8b57;
    }

    span:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="tree"></div>

  <script>
    const data = {
      name: 'root',
      type: 'folder',
      children: [
        {
          name: 'folder1',
          type: 'folder',
          children: [
            { name: 'file1.txt', type: 'file' },
            { name: 'file2.txt', type: 'file' },
          ],
        },
        {
          name: 'folder2',
          type: 'folder',
          children: [
            {
              name: 'subfolder',
              type: 'folder',
              children: [{ name: 'file3.txt', type: 'file' }],
            },
            { name: 'file4.txt', type: 'file' },
          ],
        },
        { name: 'file5.txt', type: 'file' },
      ],
    };

    const generateTree = (data, parent) => {
      const ul = document.createElement("ul");
      parent.appendChild(ul);

      data.forEach((item) => {
        const li = document.createElement("li");
        const span = document.createElement("span");
        span.textContent = item.name;
        span.className = item.type;
        li.appendChild(span);
        ul.appendChild(li);

        if (item.children && item.children.length > 0) {
          generateTree(item.children, li);
        }
      });
    };

    const tree = document.getElementById("tree");
    generateTree([data], tree);
  </script>
</body>
</html>
