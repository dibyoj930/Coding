<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Folder Tree</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    ul {
      list-style: none;
      padding-left: 1rem;
    }
    li {
      margin: 5px 0;
    }
    .folder {
      cursor: pointer;
      font-weight: bold;
    }
    .folder::before {
      content: "📁 ";
    }
    .file::before {
      content: "📄 ";
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h3>Folder Tree</h3>
  <div id="tree"></div>

  <script>
    const data = {
      name: "root",
      type: "folder",
      children: [
        {
          name: "folder1",
          type: "folder",
          children: [
            { name: "file1.txt", type: "file" },
            { name: "script.js", type: "file" },
          ],
        },
        {
          name: "folder2",
          type: "folder",
          children: [
            {
              name: "subfolder",
              type: "folder",
              children: [{ name: "file3.html", type: "file" }],
            },
            { name: "styles.css", type: "file" },
          ],
        },
        { name: "README.md", type: "file" },
      ],
    };

    function createTree(item) {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = item.name;
      span.className = item.type;

      li.appendChild(span);

      if (item.children) {
        const ul = document.createElement("ul");
        ul.classList.add("hidden");

        item.children.forEach(child => {
          ul.appendChild(createTree(child));
        });

        span.addEventListener("click", () => {
          ul.classList.toggle("hidden");
        });

        li.appendChild(ul);
      }

      return li;
    }

    const tree = document.getElementById("tree");
    const ul = document.createElement("ul");
    ul.appendChild(createTree(data));
    tree.appendChild(ul);
  </script>
</body>
</html>
