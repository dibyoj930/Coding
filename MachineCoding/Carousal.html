<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .images{
            height: 300px;
            width: 250px;
            object-fit: cover;
        }
        /* .main{
            background-color: antiquewhite;
            height: 100vh;
            width: 100vw;
        } */
    </style>
</head>
<body>
    <div id="main-div" >
       <div id="imageholder" class="main">
        
       </div>
       <button id="prev"></button>
       <button id="next"></button>
    </div>
    <script>
        const images = [
  {
    src: "https://images.unsplash.com/photo-1516117172878-fd2c41f4a759",
    alt: "A beautiful sunrise over the mountains",
    title: "Sunrise in the Mountains",
  },
  {
    src: "https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0",
    alt: "A calm beach with clear blue water",
    title: "Relaxing Beach",
  },
  {
    src: "https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0",
    alt: "A dense forest with towering trees",
    title: "Mystic Forest",
  },
  {
    src: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750",
    alt: "A cityscape at night with bright lights",
    title: "City Lights at Night",
  },
  {
    src: "https://images.unsplash.com/photo-1441931423375-cc2d99eebb62",
    alt: "A serene lake surrounded by mountains",
    title: "Peaceful Lake",
  },
];

  let activeindex=0;
  const imageholder =  document.getElementById("imageholder");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");
  prev.textContent="Previous";
  next.textContent="Next"
  console.log(activeindex)
  const imagelement = document.createElement("img");
  imageholder.appendChild(imagelement);
  imagelement.classList.add("image")
  const updateimage = ()=>{
    console.log("called!!!!",activeindex)
        imagelement.url = images[activeindex].src
        imagelement.alt = images[activeindex].alt
        imagelement.title = images[activeindex].title
     }
     updateimage();
 next.addEventListener("click",()=>{
        if(activeindex===images.length-1){
            activeindex=0;
            updateimage();
        }else{
            activeindex++;
            updateimage();
        }
     })
    prev.addEventListener("click",()=>{
        if(activeindex===0){
            activeindex=images.length-1;
            updateimage();
        }else{
            activeindex--;
            updateimage();
        }
     })
    </script>
</body>
</html>
