<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Progress Bar with Run Count</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    .bar-container {
      width: 100%;
      background: #eee;
      border-radius: 5px;
      margin-top: 10px;
      height: 20px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width linear;
    }

    #run-count {
      margin-top: 10px;
      font-weight: bold;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <button id="start">Start Progress</button>

  <div class="bar-container">
    <div class="bar" id="progress-bar"></div>
  </div>

  <div id="run-count">Run: 0 / 0</div>

  <script>

    const start  = document.getElementById("start");
    const progress = document.getElementById("progress-bar");
    const run = document.getElementById("run-count");

    let curr=0;
    let total=0;
    let isrunning=false;
    const queue=[];
    let duration=3000

    start.addEventListener("click",()=>{
      total++;
      queue.push(()=>runProgress(duration));
      updatelabel();
      if(!isrunning)runQue();
    })
    
    const updatelabel=()=>{
      run.textContent = `Run:${curr}/${total}`
    }

  const runProgress=(time)=>{
    return new Promise((res)=>{
      progress.style.width="0%";
    progress.style.transition="none";
    void progress.offsetWidth;

    progress.style.transition=`width ${time}ms linear`;
    progress.style.width="100%";
    curr++;
    updatelabel();
    setTimeout(res,time);
    })
   
  }
  async function runQue(){
    isrunning=true;
    while(queue.length>0){
      const next = queue.shift();
      await next();
    }
    isrunning=false;
    curr=0;
    total=0;
    updatelabel();
  }

  </script>

</body>
</html>
