<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <input type="text" id="searchInput" placeholder="Search...">
        <table id="dataTable">
          <thead>
            <tr>
              <th data-sort="name">Name</th>
              <th data-sort="age">Age</th>
              <th data-sort="country">Country</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
    </div>
    <script>
       const data = [
  { name: 'John', age: 28, country: 'USA' },
  { name: 'Alice', age: 24, country: 'Canada' },
  { name: 'Bob', age: 32, country: 'UK' },]

      const searchinput = document.getElementById("searchInput");
      const table = document.getElementById("dataTable");
      const tbody = document.querySelector("tbody");

      const createTable = (arr)=>{
        tbody.innerHTML=''
        arr.forEach((x)=>{
          const tr = document.createElement("tr");
          for(let key of Object.keys(x)){
            const data = document.createElement("td");
            data.textContent = x[key];
            tr.appendChild(data);
          }
          tbody.appendChild(tr);
        })
      }

      searchinput.addEventListener("input",(e)=>{
        const value  = e.target.value.toLowerCase();
        const filteredList = data.filter((x)=>x.name.toLowerCase().includes(value)||x.country.toLowerCase().includes(value));
        createTable(filteredList);
      })
      window.addEventListener("load",()=>createTable(data))

    </script>
</body>
</html>
