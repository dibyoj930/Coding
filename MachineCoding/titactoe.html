<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {  
    font-family: 'Poppins', sans-serif;
    color: #000000;
}

h1 {
    text-align: center;
}

#board {
    margin-left: auto;
    margin-right: auto;
    width: 375px;
    height: 375px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-gap: 5px;
}

.square {
    width: 120px;
    height: 120px;
    border: 1px solid #D3D3D3;
    background-color: #F5F5F5;
    font-size: 40px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.square:hover {
    background-color: #FFFFE0;
}

#restartButton {
    display: block;
    margin-left: auto;
    margin-right: auto;
    height: 40px;
    width: 150px;
    background-color: #FFFFFF;
    border: 1px solid #000000;
    border-radius: 40px;
    font-size: 18px;
}

#restartButton:hover {
    background-color: #000000;
    color: #FFFFFF;
}
    </style>
</head>
<body>
    <div id="title">
        <h1>Tic Tac Toe</h1>
    </div>
    <div id="board">
        <div class="square" id="square0"></div>
        <div class="square" id="square1"></div>
        <div class="square" id="square2"></div>
        <div class="square" id="square3"></div>
        <div class="square" id="square4"></div>
        <div class="square" id="square5"></div>
        <div class="square" id="square6"></div>
        <div class="square" id="square7"></div>
        <div class="square" id="square8"></div>
    </div>  
    <div id="endGame">
        <input type="button" value="Restart" id="restartButton" onclick="restartButton()"/>
    </div> 
    <script>

        const board=document.getElementById("board");
        const squares = document.querySelectorAll(".square");
        const restart = document.getElementById("restartButton");
        const endpart = document.createElement("p");
        const players=['X','O']
        let curr = players[0];
        endpart.textContent=`${curr}'s turn`;
        board.appendChild(endpart);

        const winning_combinations=[
            [0,1,2],
            [3,4,5],
            [6,7,8],
            [0,3,6],
            [1,4,7],
            [2,5,8],
            [0,4,8],
            [2,4,6]
        ]

        for(let i=0;i<squares.length;i++){
            squares[i].addEventListener("click",()=>{
                if(squares[i].textContent!==''){
                    return;
                }
                squares[i].textContent=curr;
                if(checkwin(curr)){
                  endpart.textContent=`Player ${curr} has won!`
                  return;
                //   alert(`${curr} has won`);
                }
                if(checkdraw()){
                  endpart.textContent=`Draw Match!`;
                  alert("draw match!");
                  return;
                }
                curr=curr===players[0]?players[1]:players[0];
                endpart.textContent=`${curr}'s turn`
            })
        }

        function checkdraw(){
           for(let i=0;i<squares.length;i++){
            if(squares[i].textContent===''){
                return false;
            }
           }
           return true;
        }
        function checkwin(play){
            for(let i=0;i<winning_combinations.length;i++){
                const [a,b,c]=winning_combinations[i];
                if(squares[a].textContent===curr&&squares[b].textContent===curr&&squares[c].textContent===curr){
                    return true;
                }
            }
            return false;
        }

        restart.addEventListener("click",()=>{
            for(let i=0;i<squares.length;i++){
                squares[i].textContent='';
            }
            curr=players[0];
            endpart.textContent=`${curr}'s Turn`
        })


    </script>
</body>
</html>
