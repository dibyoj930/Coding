  <title>Stopwatch with Milliseconds</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #main-div {
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }

    #main-div h1 {
      margin-bottom: 30px;
      font-size: 24px;
      color: #333;
    }

    #timer {
      display: flex;
      justify-content: center;
      gap: 5px;
      font-size: 40px;
      font-weight: bold;
      margin-bottom: 30px;
      color: #007bff;
      letter-spacing: 1px;
    }

    #timer div {
      min-width: 50px;
    }

    #ms {
      font-size: 24px;
      color: #666;
    }

    button {
      padding: 10px 20px;
      margin: 0 5px;
      border: none;
      border-radius: 6px;
      background-color: #007bff;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="main-div">
    <h1>Stopwatch</h1>
    <div id="timer">
      <div id="hr">00</div>:
      <div id="min">00</div>:
      <div id="sec">00</div>:
      <div id="ms">00</div>
    </div>
    <div>
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="stop">Reset</button>
    </div>
  </div>

  <script>
      const start =  document.getElementById("start");
      const pause = document.getElementById("pause");
      const Stop = document.getElementById("stop");

      const ms = document.getElementById("ms");
      const sec = document.getElementById("sec");
      const min = document.getElementById("min");
      const hr = document.getElementById("hr");

      let isRunning=false;
      let time=0;
      let timer=null;
      

      const updateDisplay=()=>{
        let seconds = Math.floor(time/100);
        let milliseconds = time%100;
        let secs = (seconds%60);
        let minutes = Math.floor((seconds/60)%60);
        let hours = Math.floor((seconds/3600));

        hr.textContent = hours.toString().padStart(2,"0");
        min.textContent = minutes.toString().padStart(2,"0");
        sec.textContent = secs.toString().padStart(2,"0");
        ms.textContent = milliseconds.toString().padStart(2,"0");

      }

      const resetWatch = ()=>{
        hr.textContent="00";
        min.textContent="00";
        sec.textContent="00";
        ms.textContent="00";
        updateDisplay();
      }


      const startInterval=()=>{
        timer = setInterval(()=>{
          time++;
          updateDisplay();
        },10)
        isRunning=true;
      }
      
      start.addEventListener("click",()=>{
        start.disabled = true;
        pause.disabled = false;
        if(!isRunning){
          startInterval();
        }
      })
      Stop.addEventListener("click",()=>{
      //   startbtn.disabled = false;
      // pause.disabled = false;
      clearInterval(timer);
      milliseconds = 0;
      isRunning = false;
      pause.textContent = "Pause";
      resetWatch();
      });
      window.addEventListener("click",()=>resetWatch());

      pause.addEventListener("click",()=>{
        if(isRunning){
          pause.textContent="resume";
          clearInterval(timer);
          isRunning=false;
        }else{
          startInterval();
          pause.textContent="pause";

        }
      })
