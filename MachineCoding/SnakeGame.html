    <style>
         body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        .board{
            display: grid;
            grid-template-columns: repeat(10,50px);
            grid-template-rows: repeat(10,50px);
            grid-gap: 5px;
            border: 2px solid gray;
            margin-bottom: 20px;
        }
        .snake{
            background-color: red;
        }
        .ladder{
            background-color: green;
        }
        .cell{
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            border: 1px solid black;
        }
        .active{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <div id="board"></div>
    <button id="rolldice"></button>
    <script>

        document.addEventListener("DOMContentLoaded",()=>{
            const board = document.getElementById("board");
            const rollbtn  = document.getElementById("rolldice");
            board.classList.add("board");
            rollbtn.textContent="roll dice"
            for(let i=1;i<=100;i++){
                const cell = document.createElement("div");
                cell.classList.add("cell");
                cell.textContent=i;
                cell.id=i;
                board.appendChild(cell);
            }
            
            const getplayerpos=(curr,value)=>{
                const newpos = curr+value;
                return snakesAndLadders[newpos]||newpos;
            }
            const snakesAndLadders = {
        16: 6,
        47: 26,
        49: 11,
        56: 53,
        62: 19,
        64: 60,
        87: 24,
        93: 73,
        95: 75,
        98: 78,
    };
         for(let [snake,ladder] of Object.entries(snakesAndLadders)){
            document.getElementById(snake).classList.add("snake");
            document.getElementById(ladder).classList.add("ladder");
         }
         const getrandom = ()=>{
            return Math.floor(Math.random()*6)+1;
         }
         let playerpos=1;
         
         const updatepos=()=>{
            const cells = document.querySelectorAll(".cell");
            cells.forEach((x)=>x.classList.remove("active"));
            document.getElementById(playerpos).classList.add("active");
         }
         const fun =()=>{
            const newp = getrandom();
            alert("you got "+newp);
            playerpos = getplayerpos(playerpos,newp);
            alert("you will be landed "+playerpos);
            updatepos();
         }
         if(playerpos>99){
            const div=document.createElement("div");
            div.textContent='Your game is completed!';
            board.appendChild(div);
        }
         rollbtn.addEventListener("click",()=>fun())
          updatepos();
        })
