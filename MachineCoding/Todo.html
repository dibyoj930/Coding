<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Add Todo</h2>
    <input type="text" id="input" />
    <button id="submit">Submit</button>
    <div id="todoholder"></div>
    <script>

        const taskholder = document.getElementById("todoholder");
        const submit = document.getElementById("submit");
       
        submit.addEventListener("click",()=>{
            const input = document.getElementById("input");
            const value = input.value;
            if(value==="")alert("empty value!");
            addtask(value);
            input.value=""
        })

        const addtask=(text)=>{
            const todoholder = document.createElement("ul");
            const task = document.createElement("li");
            const tasktext = document.createElement("span");
            tasktext.textContent=text;

            const editButton = document.createElement("button");
            editButton.textContent = "Edit";

            editButton.addEventListener("click",function handleEdit(){
                  const editinputholder = document.createElement("input");
                  editinputholder.type="text";
                  editinputholder.value=tasktext.textContent;
                  task.replaceChild(editinputholder,tasktext);
                  editButton.textContent = "Save";

                  editButton.removeEventListener("click",handleEdit)

                  //again another handler 
                //   editButton.removeEventListener(handleEdit);
                  editButton.addEventListener("click",function handlesave(){
                    tasktext.textContent = editinputholder.value;
                    editButton.textContent = "Edit";
                    task.replaceChild(tasktext,editinputholder);
                    editButton.removeEventListener("click",handlesave);
                  
                    editButton.addEventListener("click",handleEdit)
                  })
                 
            })
           
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click",()=>{
                todoholder.removeChild(task)
            })

            
            
            task.appendChild(tasktext);
            task.appendChild(editButton);
            task.appendChild(deleteButton)
            todoholder.appendChild(task);
            taskholder.appendChild(todoholder)
        }








    </script>
</body>
</html>
