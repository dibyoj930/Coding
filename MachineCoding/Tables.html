<body>
    <div id="main-div">
        <form id="form">
            <div id="rowdiv">
              <label>Insert Rows</label>
              <input type="number" id="row"/>
            </div>
            <div id="coldiv">
                <label>Insert Cols</label>
                <input type="number" id="col"/>
              </div>
            <button id="submit">Submit</button>
        </form>
        <div id="tablecontainer">

        </div>
    </div>
    <script>
        const form = document.getElementById("form");
        const insertrow = document.getElementById("row");
        const insertcol = document.getElementById("col");
        const container = document.getElementById("tablecontainer");

        let rowval='',colval='';

        insertrow.addEventListener("input",(e)=>{
            rowval=e.target.value;
        })
        insertcol.addEventListener("input",(e)=>{
            colval=e.target.value;
        })
        const table = document.createElement("table");
        table.style.borderCollapse = "collapse";
        const createTable=()=>{
            table.innerHTML='';
            const thead = document.createElement("thead");
            const tr = document.createElement("tr");
            for(let i=0;i<colval;i++){
                const th = document.createElement("th");
                th.textContent=`Header-${i+1}`;
                tr.appendChild(th);
            }
            thead.appendChild(tr);
            const tbody = document.createElement("tbody");

            for(let j=0;j<rowval;j++){
                const tr = document.createElement("tr");
                for(let k=0;k<colval;k++){
                    const td = document.createElement("td");
                    td.textContent=`row-${j+1},col-${k+1}`;
                    tr.appendChild(td);
                }
                tr.style.border="1px solid black"
                tbody.appendChild(tr);
            }
            table.appendChild(thead);
            table.style.border="1px solid black"
            table.style.padding="10px";
            table.appendChild(tbody);
            // container.innerHTML='';
            container.appendChild(table);
        }


        form.addEventListener("submit",(e)=>{
             e.preventDefault();
             createTable();
        })
