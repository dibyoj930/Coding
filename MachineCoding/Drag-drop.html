<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        .item{
            cursor: pointer;
    padding: 10px;
    background-color: white;
    width: 150px;
    border: 1px solid gray;
    margin: 5px;
    border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="main-div">
       <div id="items">

       </div>
    </div>
    <script>

        let startDiv;
        let NUM=5;
        let item=new Array(NUM).fill().map((_,index)=>index);

        const maindiv = document.getElementById("items");
        item.forEach((x,i)=>{
            const newdiv=document.createElement("div");
            newdiv.textContent=`Div-${i+1}`;
            newdiv.draggable=true;
            newdiv.classList.add("item")
            newdiv.addEventListener("dragstart",(e)=>{
                startDiv=e.target;
            })
            newdiv.addEventListener("dragover",(e)=>{
                e.preventDefault();
            })
            newdiv.addEventListener("drop",(e)=>{
               if(e.target!==startDiv){
                const islast=e.target===maindiv.lastChild;
                if(islast){
                    maindiv.appendChild(startDiv);
                }else{
                    maindiv.insertBefore(startDiv,e.target);
                }
               }
            })
            maindiv.appendChild(newdiv);
        })

    </script>
</body>
</html>
