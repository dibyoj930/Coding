    body {

    .product-select {
      margin-bottom: 20px;
    }
    .product-select label {
      margin-right: 15px;
    }
    .comparison-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    .comparison-table th,
    .comparison-table td {
      border: 1px solid #ccc;
      padding: 10px;

    }

<div class="product-select" id="productSelect"></div>
<button id="compareBtn">Compare</button>

//label and checkbox addition
productsData.forEach((x)=>{
  const label=document.createElement("label");
  const input = document.createElement("input");
  input.type="checkbox";
  input.id=x.id;
  label.appendChild(input);
  label.append(`${x.name}`);
  pdtselect.appendChild(label);
})

//handle comparison
compare.addEventListener("click",()=>{
  const compareres = document.getElementById("comparisonResult");
  compareres.innerHTML='';
  const selectedid = Array.from(document.querySelectorAll(".product-select input:checked")).map((x)=>Number(x.id));
  console.log(selectedid);
  const productdetails = productsData.filter((x)=>selectedid.includes(x.id));
  console.log(productdetails);
  const unique = new Set();
  productdetails.map((x)=>Object.keys(x.features).forEach((u)=>unique.add(u)));
  console.log(unique);
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  if(productdetails.length<2){
    alert("enter something more!");
  }
  thead.innerHTML=`<td>Feature</td>`+productdetails.map((z)=>
   `<td>${z.name}</td>`
).join(" ")
table.appendChild(thead);

  unique.forEach((z)=>{
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>feature</td>`+productdetails.map((s)=>
      `<td>${s.features[z]||'-'}</td>`
  ).join(" ")
  table.appendChild(tr);
  })
compareres.appendChild(table);
})
