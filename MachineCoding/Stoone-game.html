<body>
    <div style="display: flex;align-items: center;justify-content: center; margin: 1rem;">
       <div style="display: flex;align-items: center; gap: 1rem;">
         <button id="stone">Stone</button>
         <button id="paper">Paper</button>
         <button id="scissor">Scissor</button>
       </div>
       <div id="result" style="margin-top: 1rem; font-size: 1.2rem;"></div>
       <div id="score" style="margin-top: 0.5rem;"></div>
    </div>
    <script>
        const stone = document.getElementById("stone");
        const paper = document.getElementById("paper");
        const scissor = document.getElementById("scissor");
        const resultDiv = document.getElementById("result");
        const scoreDiv = document.getElementById("score");

        let userScore=0;
        let computerScore=0;

        const choices=["stone","paper","scissor"];
        const getRandomChoice=()=>{
          return choices[Math.floor(Math.random()*choices.length)];
        }

        const getResult=(userChoice,Computer)=>{
          if(userChoice===Computer)return "Draw!";
          if(userChoice=="stone"&&Computer=="scissor"||userChoice=="paper"&&Computer=="stone"||userChoice=="scissor"&&Computer=="paper"){
            return "win!"
          }else{
            return "lose!"
          }
        }

        const playRound=(user)=>{
          const computer = getRandomChoice();
          const result = getResult(user,computer);
          if(result=="win!"){
            userScore++;
            resultDiv.textContent=`You chose ${user}|computer chose ${computer}. You win!`
          }else if(result=="lose!"){
            computerScore++;
            resultDiv.textContent=`You chose ${user}|computer chose ${computer}. you lose!`
          }else{
            resultDiv.textContent=`You and computer both chose ${user} | It's a draw!`
          }
          scoreDiv.textContent=`Your score ${userScore} | computer score-${computerScore}`;
        }

        stone.addEventListener("click",()=>playRound("stone"));
        paper.addEventListener("click",()=>playRound("paper"))
        scissor.addEventListener("click",()=>playRound("scissor"))
