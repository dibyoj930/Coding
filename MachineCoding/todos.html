    <h2>Add Todo</h2>
    <input type="text" id="input"/>
    <button id="button">Submit</button>
    <div id="taskholder"></div>
    <script>
        const add = document.getElementById("input");
        const submit = document.getElementById("button");
        const container = document.getElementById("taskholder");

        submit.addEventListener("click",()=>{
            if(add.value===""){
                alert("enter some value!");
            }
            addtask(add.value);
            add.value='';
        })

        const addtask=(text)=>{
            const taskholder  = document.createElement("ul");
            const task = document.createElement("li");
            const span = document.createElement("span");
            span.textContent = text;
            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click",()=>{
                taskholder.removeChild(task);
            })

            const editButton = document.createElement("button");
            editButton.textContent = 'Edit';

            editButton.addEventListener("click",function handleEdit(){
                const editinput = document.createElement("input");
                editinput.type="text";
                editinput.value=span.textContent;
                task.replaceChild(editinput,span);
                editButton.textContent="save";

                editButton.removeEventListener("click",handleEdit)

                editButton.addEventListener("click",function handleSave(){
                     span.textContent = editinput.value;
                     editButton.textContent="edit";
                     task.replaceChild(span,editinput);
                     editButton.removeEventListener("click",handleSave);
                     editButton.addEventListener("click",handleEdit);
                })
            })


            task.appendChild(span);
            task.appendChild(deleteButton);
            task.appendChild(editButton);
            taskholder.appendChild(task);
            container.appendChild(taskholder);
        }
