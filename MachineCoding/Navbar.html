<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        *{
    margin: 0;
}
#main-div{
    background-color: whitesmoke;
    height: 100vh;
    width: 100vw;
}
#navbar-ul{
    display: flex;
    flex-direction: row;
}
#navbar-li{
    padding: 10px;
    cursor: pointer;
}
#hamburger-handle{
    padding: 25px;
    cursor: pointer;
}
#hamburger-item{
    margin: 0px 0px 0px 15px;
    cursor: pointer;
}
#hamburger-items{
    display: none;
}
#hamb-holder{
    display: none;
}
    </style>
</head>

<body>

    <div id="main-div">
        <nav class="navbar">
            <ul id="navbar-ul"> 
                <div id="navbar-li">Home</div>
                <div id="navbar-li">About</div>
                <div id="navbar-li">Gallery</div>
                <div id="navbar-li">Booking</div>
                <div id="navbar-li">More</div>
            </ul>
        </nav>

        <div id="hamb-holder">
        <nav class="navbar-hamburger">
            <div id="hamburger-handle">
                =
            </div>
        </nav>
        <div id="hamburger-items">
            <div id="hamburger-item">About</div>
            <div id="hamburger-item">Gallery</div>
            <div id="hamburger-item">Booking</div>
            <div id="hamburger-item">More</div>
        </div>
    </div>


    </div>
    <script>
        var currentWidth = window.innerWidth;
const navbar = document.querySelector('.navbar')
const hambHolder = document.getElementById('hamb-holder')
const handle = document.getElementById('hamburger-handle')
const hamburgerItem = document.getElementById('hamburger-item')

const hamburgerItems = document.getElementById('hamburger-items')
const displayNavbar = (currWidth) => {
    console.log(currWidth)
    if(currWidth < 460){
        navbar.style.display = 'none'
        hambHolder.style.display = 'block'

    }else{   
        hambHolder.style.display = 'none'
        navbar.style.display = 'block'

    }
}
window.addEventListener('load', () => {
    currentWidth = window.innerWidth;
    displayNavbar(currentWidth)
});

window.addEventListener('resize', () => {
    currentWidth = window.innerWidth;
    displayNavbar(currentWidth)
});

handle.addEventListener('click', ()  => {

    if(hamburgerItems.style.display === 'block'){
        hamburgerItems.style.display = 'none'
    }else{
        hamburgerItems.style.display = 'block'
    }
})

hamburgerItem.addEventListener('click', () => {
    hamburgerItems.style.display = 'none'
})
    </script>

</body>
<!-- <script src="script.js"> -->
</script>

</html>
