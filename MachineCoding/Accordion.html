       body{
        display: flex;
        align-items: center;
        justify-content: center;
       }
       .accordion{
        width: 100%;
        border: 1px solid yellow;
        border-radius: 8px;
        padding: 10px;
       }

       .accordion-header{
        background-color: aliceblue;
            padding: 15px;
            font-weight: bold;
            cursor: pointer;
       }
       .accordion-body{
        border: 1px solid yellow;
        /* border-radius: 8px; */
        padding: 10px;
        display: none;
       }
       .accordion-body.active{
        display: block;
       }


    </style>
</head>
<body>
    <div id="container" style="width: 100%;">

    </div>
    <script>
        const data = [
  {
    title: "Accordion Item 1",
    content: "This is the content for item 1.",
  },
  {
    title: "Accordion Item 2",
    content: "This is the content for item 2.",
  },
  {
    title: "Accordion Item 3",
    content: "This is the content for item 3.",
  },
  {
    title: "Accordion Item 4",
    content: "This is the content for item 4.",
  },
];
  const container = document.getElementById("container");

   data.forEach((accordion,index)=>{
    const accordionItem = document.createElement("div");
    accordionItem.classList.add("accordion");
    const header = document.createElement("div");
    header.textContent = accordion.title
    header.classList.add("accordion-header");
    const content = document.createElement("div");
    content.classList.add("accordion-body");
    content.textContent = accordion.content;
    header.addEventListener("click",()=>{
        const content = accordionItem.querySelector(".accordion-body");
        content.classList.toggle("active")
    })
    accordionItem.appendChild(header);
    accordionItem.appendChild(content);
    container.appendChild(accordionItem);
   })
