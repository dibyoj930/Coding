<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Star Rating (Half Support)</title>
  <style>
    .rating {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }

    .star {
      font-size: 40px;
      color: lightgray;
      cursor: pointer;
      position: relative;
      width: 40px;
      height: 40px;
    }

    .star::before {
      content: "★";
      position: absolute;
      top: 0;
      left: 0;
      color: lightgray;
    }

    .star.full::before {
      color: gold;
      width: 100%;
      overflow: visible;
    }

    .star.half::before {
      color: gold;
      width: 50%;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="rating">
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
    <span class="star"></span>
  </div>

  <script>
    const stars = document.querySelectorAll(".star");
    let selected = 0;

    stars.forEach((star, index) => {
      star.addEventListener("mousemove", (e) => {
        const rect = star.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const isHalf = x < rect.width / 2;
        const value = index + (isHalf ? 0.5 : 1);
        highlight(value);
      });

      star.addEventListener("mouseout", () => {
        update();
      });

      star.addEventListener("click", (e) => {
        const rect = star.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const isHalf = x < rect.width / 2;
        selected = index + (isHalf ? 0.5 : 1);
        update();
      });
    });

    function update() {
      stars.forEach((star, i) => {
        star.classList.remove("full", "half");
        if (selected >= i + 1) {
          star.classList.add("full");
        } else if (selected >= i + 0.5) {
          star.classList.add("half");
        }
      });
    }

    function highlight(value) {
      stars.forEach((star, i) => {
        star.classList.remove("full", "half");
        if (value >= i + 1) {
          star.classList.add("full");
        } else if (value >= i + 0.5) {
          star.classList.add("half");
        }
      });
    }
  </script>

</body>
</html>
