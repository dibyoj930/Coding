<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #selected-option {
    font-size: 18px;
    padding: 20px;
}
#search-container {
    border: 1px solid gray;
    border-radius: 5px;
    cursor: pointer;
}

#search {
    border: none;
}

#search-items {
    display: none;
}
        .list-item{
            cursor: pointer;
    background-color: white;
    margin: 4px;
    border: 1px solid gray;
    border-radius: 5px;
    font-size: 12px;
        }

    </style>
</head>
<body>
<div id="main-div">
    <div id="dropdown">
      <div id="search-container">
        <input type="text" id="search"/>
      </div>
      <div id="search-items">

      </div>
    </div>
       <div id="selected-option">

       </div>
    </div>
    <script>
     const dropdownContainer = document.getElementById("dropdown");
const searchBar = document.getElementById('search')
const searchItems = document.getElementById('search-items')  
const selectedOptionDisplay = document.getElementById('selected-option')
const searchContainer = document.getElementById('search-container')

const OPTIONS = [
  "Sydney",
  "Tokyo",
  "New York",
  "London",
  "Paris",
  "Toronto",
  "Rio de Janeiro",
  "Cape Town",
  "Berlin",
  "Buenos Aires",
];

const createList = (array) => {
  searchItems.innerHTML = null
  for (let i = 0; i < array.length; i++) {
    const element = array[i];
    const listItem = document.createElement('div')
    listItem.classList.add('list-item')
    listItem.textContent = element

    listItem.addEventListener('click', () => {
      selectedOptionDisplay.textContent = `Your Selected City Is ${element}`
      searchItems.style.display = 'none'
    })

    searchItems.appendChild(listItem)
  }
  dropdownContainer.appendChild(searchItems)
}

window.addEventListener('load', () => createList(OPTIONS))

searchBar.addEventListener('keyup', (e) => {
  let searchTerm = e.target.value.toLowerCase()
  let filteredList = OPTIONS.filter((item) => item.toLowerCase().includes(searchTerm))
  createList(filteredList)
  console.log(filteredList)
})

searchContainer.addEventListener('click', () => {
  if(searchItems.style.display === 'block'){
    searchItems.style.display = 'none'
  }else{
    searchItems.style.display = 'block'
  }
})
    </script>

</body> 
</html>
